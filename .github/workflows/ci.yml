name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Build and test (JDK 8 — allow test failures for CLDR locale differences)
        if: matrix.java == '8'
        run: mvn clean install -B -Dmaven.test.failure.ignore=true

      - name: Build and test (JDK ${{ matrix.java }})
        if: matrix.java != '8'
        run: mvn clean install -B
