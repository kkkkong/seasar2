name: Maven CI
on:
  push:
    branches: [ master, ci-and-contrib ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [8]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 1: สร้าง custom settings.xml เพื่อปลดล็อก HTTP Blocker ของ Maven
      - name: Create Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat << 'EOF' > ~/.m2/settings.xml
          <settings>
            <mirrors>
              <!-- ปลดล็อก http-blocker โดยส่งต่อ http repository ให้ไปดาวน์โหลดได้ปกติ -->
              <mirror>
                <id>allow-http</id>
                <mirrorOf>external:http:*</mirrorOf>
                <url>http://maven.seasar.org/maven2</url>
                <blocked>false</blocked>
              </mirror>
            </mirrors>
          </settings>
          EOF

      # Step 2: สั่ง Build โดยระบุ -s ~/.m2/settings.xml
      - name: Build Core Framework (seasar2)
        working-directory: ./seasar2
        run: mvn -B -V -e install -DskipTests -s ~/.m2/settings.xml

      - name: Build s2-tiger
        working-directory: ./s2-tiger
        run: mvn -B -V -e install -DskipTests -s ~/.m2/settings.xml

      - name: Build s2jdbc-gen
        working-directory: ./s2jdbc-gen
        run: mvn -B -V -e install -DskipTests -s ~/.m2/settings.xml