name: Maven CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build with JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Install Proprietary IBM uow_api JAR
        working-directory: ./seasar2
        run: |
          mvn install:install-file \
            -Dfile=lib/uow_api-6.jar \
            -DgroupId=com.ibm.websphere \
            -DartifactId=uow_api \
            -Dversion=6 \
            -Dpackaging=jar

      - name: Build seasar2 modules (s2-framework, s2-extension, s2-dist)
        working-directory: seasar2
        run: mvn clean install -B

      - name: Build s2-tiger
        working-directory: s2-tiger
        run: mvn clean install -B

      - name: Build s2jdbc-gen
        working-directory: s2jdbc-gen
        run: mvn clean install -B
