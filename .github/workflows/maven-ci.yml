name: Maven CI
on:
  push:
    branches: [ master, ci-and-contrib ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [8]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Step Cache ของคุณ (เก็บไว้ตรงนี้ได้เลย)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # สั่ง Build เรียงตามลำดับ Sub-modules
      - name: Build Core Framework (seasar2)
        working-directory: ./seasar2
        run: mvn -B -V -e install -DskipTests

      - name: Build s2-tiger
        working-directory: ./s2-tiger
        run: mvn -B -V -e install -DskipTests

      - name: Build s2jdbc-gen
        working-directory: ./s2jdbc-gen
        run: mvn -B -V -e install -DskipTests