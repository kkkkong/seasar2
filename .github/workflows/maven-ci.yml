name: Maven CI
on:
  push:
    branches: [ master, ci-and-contrib ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [8]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 1. Build seasar2 (เพิ่ม -Dmaven.wagon.http.ssl.insecure=true และสั่งผ่าน HTTP Blocker)
      - name: Build Core Framework (seasar2)
        working-directory: ./seasar2
        run: mvn -B -V -e install -DskipTests -DallowInsecure=true -DsuppressUnresolvableInInsecureRepositories=true -Dmaven.resolver.transport=wagon
        env:
          MAVEN_OPTS: "-Dmaven.wagon.http.insecure=true -Dmaven.wagon.http.ssl.insecure=true"

      # 2. Build s2-tiger
      - name: Build s2-tiger
        working-directory: ./s2-tiger
        run: mvn -B -V -e install -DskipTests
        env:
          MAVEN_OPTS: "-Dmaven.wagon.http.insecure=true -Dmaven.wagon.http.ssl.insecure=true"

      # 3. Build s2jdbc-gen
      - name: Build s2jdbc-gen
        working-directory: ./s2jdbc-gen
        run: mvn -B -V -e install -DskipTests
        env:
          MAVEN_OPTS: "-Dmaven.wagon.http.insecure=true -Dmaven.wagon.http.ssl.insecure=true"